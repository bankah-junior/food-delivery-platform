openapi: 3.0.3
info:
  title: Order Service API
  version: 1.0.0
servers:
  - url: http://localhost:8083
  - url: http://localhost:8080
paths:
  /api/orders:
    post:
      summary: Place order
      parameters:
        - $ref: '#/components/parameters/XUserIdOptional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
  /api/orders/{id}:
    get:
      summary: Get order by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
  /api/orders/my-orders:
    get:
      summary: Get current customer orders
      parameters:
        - $ref: '#/components/parameters/XUserIdOptional'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
  /api/orders/restaurant/{restaurantId}:
    get:
      summary: Get restaurant orders
      parameters:
        - name: restaurantId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OrderResponse'
  /api/orders/{id}/status:
    patch:
      summary: Update order status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderStatusUpdateRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
  /api/orders/{id}/cancel:
    post:
      summary: Cancel order
      parameters:
        - $ref: '#/components/parameters/XUserIdOptional'
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
components:
  parameters:
    XUserIdOptional:
      name: X-User-Id
      in: header
      required: false
      schema:
        type: integer
        format: int64
  schemas:
    PlaceOrderRequest:
      type: object
      required: [restaurantId, items]
      properties:
        restaurantId:
          type: integer
          format: int64
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/OrderItemRequest'
        deliveryAddress:
          type: string
        specialInstructions:
          type: string
    OrderItemRequest:
      type: object
      required: [menuItemId, quantity]
      properties:
        menuItemId:
          type: integer
          format: int64
        quantity:
          type: integer
          minimum: 1
        specialInstructions:
          type: string
    OrderStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [PLACED, CONFIRMED, PREPARING, READY_FOR_PICKUP, OUT_FOR_DELIVERY, DELIVERED, CANCELLED]
    OrderItemDetail:
      type: object
      properties:
        id:
          type: integer
          format: int64
        menuItemId:
          type: integer
          format: int64
        quantity:
          type: integer
        unitPrice:
          type: number
          format: double
        subtotal:
          type: number
          format: double
        specialInstructions:
          type: string
    OrderResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
        totalAmount:
          type: number
          format: double
        deliveryFee:
          type: number
          format: double
        deliveryAddress:
          type: string
        specialInstructions:
          type: string
        createdAt:
          type: string
          format: date-time
        estimatedDeliveryTime:
          type: string
          format: date-time
        customerId:
          type: integer
          format: int64
        restaurantId:
          type: integer
          format: int64
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemDetail'
