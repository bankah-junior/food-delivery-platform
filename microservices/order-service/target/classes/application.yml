server:
  port: 8083

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
  cloud:
    openfeign:
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 10000
            loggerLevel: basic

management:
  endpoints:
    web:
      exposure:
        include: health,info

services:
  customer:
    url: ${CUSTOMER_SERVICE_URL:http://localhost:8081}
  restaurant:
    url: ${RESTAURANT_SERVICE_URL:http://localhost:8082}
